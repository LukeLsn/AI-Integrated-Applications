<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Flashcard Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>

    /* --- BADGE TITLE CONTRAST OVERRIDES --- */
    .badge-danger-custom {
      background-color: #ff6b6b !important; /* Vibrant pastel red background */
      color: #121212 !important;            /* Pitch dark text for perfect readability */
      font-weight: bold;
    }
    .badge-success-custom {
      background-color: #47cf73 !important; /* Vibrant pastel green background */
      color: #121212 !important;            /* Pitch dark text for perfect readability */
      font-weight: bold;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
    }
    .card-custom {
      background-color: #1e1e1e;
      border: 1px solid #2d2d2d;
      color: #ffffff;
      transition: transform 0.2s;
    }
    .card-custom:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    .badge-field {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .text-quote {
      font-style: italic;
      color: #b0b0b0;
      border-left: 3px solid #0d6efd;
      padding-left: 10px;
    }
    
    /* --- CRITICAL DARK MODE TEXT CONTRAST FIXES --- */
    .answer-box {
      background-color: rgba(25, 135, 84, 0.15) !important; /* Subtle dark green tint */
      border: 1px solid rgba(25, 135, 84, 0.3) !important;
      color: #47cf73 !important; /* Crisp, bright readable green text */
    }
    .misconception-text {
      color: #ff6b6b !important; /* High contrast pastel red */
    }
    .correction-text {
      color: #4dadf7 !important; /* High contrast pastel blue */
    }
    .text-muted {
      color: #a0a0a0 !important;
    }
  </style>
</head>
<body>

  <div class="container py-5">
    <header class="text-center mb-5">
      <h1 class="display-5 fw-bold text-primary">⚡ AI Flashcard Generator</h1>
      <p class="lead text-muted">Select an available server asset file to generate cards automatically</p>
    </header>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card card-custom p-4 shadow-sm">
          <h4 class="mb-3 text-white">Workspace Configuration</h4>
          <form id="generatorForm">
            
            <div class="mb-3">
              <label for="fileSelect" class="form-label text-muted fw-semibold">Choose Notes Document</label>
              <select class="form-select bg-dark text-white border-secondary" id="fileSelect" required>
                <option value="" disabled selected>Loading available files...</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="cardsCount" class="form-label text-muted fw-semibold">Number of Cards</label>
              <select class="form-select bg-dark text-white border-secondary" id="cardsCount">
                <option value="1">1 Card</option>
                <option value="2" selected>2 Cards</option>
                <option value="3">3 Cards</option>
                <option value="4">4 Cards</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2" id="submitBtn" disabled>
              Generate Cards
            </button>
          </form>
        </div>
      </div>

      <div class="col-lg-8">
        <div id="statusArea">
          <div class="alert alert-dark border-secondary text-center p-5" id="placeholderMsg">
            <h5 class="text-muted mb-0">Select a file and hit generate to display flashcards.</h5>
          </div>
          
          <div class="text-center d-none my-5" id="loadingSpinner">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
            <p class="text-muted mt-3">AI model parsing tokens...<br><small>(Please wait. Wait time depends on the AI model currently configured)</small></p>
          </div>
        </div>

        <div class="row g-4 d-none" id="flashcardGrid"></div>
      </div>
    </div>
  </div>

  <script>
    // Global variable tracking loaded asset text block
    let activeFileContent = "";

    // 1. Instantly query available files from the backend on page load
    async function loadWorkspaceFiles() {
      const fileSelect = document.getElementById('fileSelect');
      const submitBtn = document.getElementById('submitBtn');

      try {
        const res = await fetch('/api/files');
        const data = await res.json();

        fileSelect.innerHTML = '<option value="" disabled selected>-- Select a document --</option>';
        
        if (!data.files || data.files.length === 0) {
          fileSelect.innerHTML = '<option value="" disabled>No markdown files found</option>';
          return;
        }

        data.files.forEach(fileName => {
          const option = document.createElement('option');
          option.value = fileName;
          option.textContent = `📄 ${fileName}`;
          fileSelect.appendChild(option);
        });

        submitBtn.disabled = false;
      } catch (err) {
        fileSelect.innerHTML = '<option value="" disabled>Error pulling files</option>';
        console.error(err);
      }
    }

    // 2. Automatically fetch raw content the moment a user picks a selection list file item
    document.getElementById('fileSelect').addEventListener('change', async (e) => {
      const targetFileName = e.target.value;
      try {
        const res = await fetch(`/api/files/${encodeURIComponent(targetFileName)}`);
        const data = await res.json();
        activeFileContent = data.content;
      } catch (err) {
        alert('Failed to pre-fetch file contents.');
        console.error(err);
      }
    });

    // 3. Dispatch data object to generation core endpoint logic
    document.getElementById('generatorForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!activeFileContent) {
        alert("Please wait for file content to resolve completely before submitting.");
        return;
      }

      const cards = parseInt(document.getElementById('cardsCount').value, 10);
      
      const placeholderMsg = document.getElementById('placeholderMsg');
      const loadingSpinner = document.getElementById('loadingSpinner');
      const flashcardGrid = document.getElementById('flashcardGrid');
      const submitBtn = document.getElementById('submitBtn');

      placeholderMsg.classList.add('d-none');
      loadingSpinner.classList.remove('d-none');
      flashcardGrid.classList.add('d-none');
      flashcardGrid.innerHTML = '';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ notes: activeFileContent, cards })
        });

        if (!response.ok) throw new Error(`Status: ${response.status}`);
        const data = await response.json();
        
        data.flashcards.forEach(card => {
          flashcardGrid.innerHTML += `
            <div class="col-12">
              <div class="card card-custom shadow-sm h-100">
                <div class="card-body p-4">
                  <span class="badge bg-primary badge-field mb-2">Application Context</span>
                  <h5 class="card-title text-info fw-bold mb-3">${card.application}</h5>
                  <p class="card-text mb-3"><strong>Challenge:</strong> ${card.challenge}</p>
                  
                  <p class="card-text mb-4 answer-box p-3 rounded">
                    <strong>Solution Answer:</strong> ${card.answer}
                  </p>
                  
                  <div class="mb-3">
                    <span class="badge bg-secondary badge-field mb-2">Notes Evidence</span>
                    <p class="text-quote small mb-0">"${card.evidence}"</p>
                  </div>
                  <hr class="border-secondary my-3">
                  <div class="row g-2">
                    <div class="col-md-6">
                      <span class="badge badge-danger-custom badge-field mb-2">Misconception</span>
                      <p class="small misconception-text mb-0">"${card.misconception}"</p>
                    </div>
                    <div class="col-md-6">
                      <span class="badge badge-success-custom badge-field mb-2">Correction</span>
                      <p class="small correction-text mb-0">${card.correction}</p>
                    </div>
                  </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        });

        loadingSpinner.classList.add('d-none');
        flashcardGrid.classList.remove('d-none');

      } catch (err) {
        loadingSpinner.classList.add('d-none');
        placeholderMsg.classList.remove('d-none');
        alert(`❌ Generation Failure: ${err.message}`);
      } finally {
        submitBtn.disabled = false;
      }
    });

    // Run directory parsing execution pipeline on page ready status
    loadWorkspaceFiles();

    // This webpage only works on md files that has a good enough content that the AI model can work on. Apparently if you used the md files that has the edge cases here like no content and minimal content, this will just not work
    // I might need to fix this somewhere along the road. Good to note though!
  </script>
</body>
</html>
